name: Build Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.5'

      # Pull requests have no access to the signing secrets: only check that the code compiles
      - name: Build Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Decode Release Signing Key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing. See README > Release signing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build Signed Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Remove Signing Key From Runner
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Create SHA-256 Checksum
        if: github.event_name != 'pull_request'
        working-directory: app/build/outputs/apk/release
        run: sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minimal-car-launcher-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Car Launcher v1.0.${{ github.run_number }}"
          body: |
            ### Automated Build #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Message**: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
